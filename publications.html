<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications | INSIA Lab</title>
  <meta name="description" content="Peer-reviewed journal and conference publications from the INSIA Lab.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=50">
</head>
<body data-page="publications">
<main>
  <section class="page-head">
    <div class="container">
      <span class="label"><a href="./">Home</a> / Publications</span>
      <h1 class="reveal">Selected <em>papers</em></h1>
      <p class="lede reveal" style="--i:1">Peer-reviewed journal articles and conference papers, newest first.</p>
    </div>
  </section>
  <section class="section after-head">
    <div class="container">
      <div class="facts reveal" style="margin-bottom:var(--s5)">
        <div class="fact"><b>35</b><span>Papers</span></div>
        <div class="fact"><b>14</b><span>Journal articles</span></div>
        <div class="fact"><b>21</b><span>Conference papers</span></div>
        <div class="fact"><b>3</b><span>Paper awards</span></div>
      </div>
      <div class="filters">
        <div id="filters" role="group" aria-label="Filter by type" style="display:flex;gap:18px;flex-wrap:wrap"></div>
        <span class="label" id="pubstats"></span>
        <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search title, author, venue…" aria-label="Search publications"></label>
      </div>
      <div id="pubs"></div>
    </div>
  </section>
</main>
<script src="assets/js/data.js?v=50"></script>
<script src="assets/js/main.js?v=50"></script>
<script>INSIA_RENDER.pubs(document.getElementById("pubs"), { filterEl: document.getElementById("filters"), searchEl: document.getElementById("q"), statsEl: document.getElementById("pubstats") });</script>
</body>
</html>
